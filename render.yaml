# Render hosts the shared Mirai API and its PostgreSQL database. The five role portals
# are deployed separately to Cloudflare Pages; see docs/CLOUDFLARE_DEPLOYMENT.md.
services:
  - type: web
    name: club-tracker-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: bash scripts/start_public_demo.sh
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: local
      - key: SEED_DEMO
        value: "1"
      - key: APP_NAME
        value: Mirai Club Activities Tracker
      - key: INSTITUTION_NAME
        value: Mirai
      - key: DATABASE_URL
        fromDatabase:
          name: club-tracker-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      # The five role portals are static sites on Cloudflare Pages
      # (docs/CLOUDFLARE_DEPLOYMENT.md). List their exact origins, comma-separated.
      - key: CORS_ORIGINS
        sync: false
      # Optional: a pattern for Cloudflare Pages preview deployments.
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: PUBLIC_BASE_URL
        fromService:
          name: club-tracker-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: club-tracker-demo-db
    plan: free
    region: singapore
    databaseName: clubtracker
    user: club
    postgresMajorVersion: "16"
