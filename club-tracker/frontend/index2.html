<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Tracker - Vibrant Portal</title>
<style>
  :root {
    --bg: #f4f6ff;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #6366f1;
    --accent: #14b8a6;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 2rem; display: flex; justify-content: center;
  }
  .container { max-width: 800px; width: 100%; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2rem; background: var(--card); padding: 1rem 1.5rem;
    border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(99,102,241,0.05);
  }
  .brand { font-weight: 800; font-size: 1.3rem; color: var(--primary); }
  .tabs { display: flex; gap: .5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: .5rem; }
  .tab-btn {
    background: var(--card); border: 2px solid var(--border); color: var(--muted);
    padding: .6rem 1.2rem; border-radius: 12px; cursor: pointer; font-weight: 600;
    transition: all 0.2s;
  }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .card {
    background: var(--card); border-radius: 16px; padding: 2rem;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); margin-bottom: 1.5rem;
  }
  .btn-action {
    background: var(--accent); color: white; border: none; padding: .6rem 1.2rem;
    border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 1rem;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">🌟 ClubPortal</div>
      <div style="background: #eef2ff; color: var(--primary); padding: .4rem .8rem; border-radius: 10px; font-weight: 600; font-size: .85rem;">Student View</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('Clubs', this)">Clubs</button>
      <button class="tab-btn" onclick="switchTab('Check-in', this)">Check-in</button>
      <button class="tab-btn" onclick="switchTab('Certs', this)">Certificates</button>
    </div>

    <div class="card" id="main-card">
      <h2>Explore Campus Clubs</h2>
      <p style="color: var(--muted);">Join organizations and track your participation effortlessly.</p>
      <div style="background: #f8fafc; padding: 1rem; border-radius: 12px; margin-top: 1rem; border: 1px solid var(--border);">
        <strong>AI & Machine Learning Club</strong>
        <p style="margin: .3rem 0 0; font-size: .85rem; color: var(--muted);">Seats available: 42 / 50</p>
      </div>
      <button class="btn-action" onclick="alert('Join request sent!')">Request to Join</button>
    </div>
  </div>
<script>
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('main-card').innerHTML = `
      <h2>${name} Section</h2>
      <p style="color: var(--muted);">Interactive view for ${name} is ready.</p>
    `;
  }
</script>
</body>
</html>
