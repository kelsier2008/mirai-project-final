<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Frosted Pastel</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 50%, #ccfbf1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .container { max-width: 700px; width: 100%; }
  .glass { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 20px; padding: 2rem; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); margin-bottom: 1.5rem; }
  .nav { display: flex; gap: .75rem; margin-bottom: 1.5rem; }
  .nav button { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); padding: .5rem 1rem; border-radius: 12px; cursor: pointer; font-weight: 500; font-size: .9rem; transition: 0.2s; }
  .nav button.active { background: #4f46e5; color: white; border-color: #4f46e5; }
  h2 { margin-top: 0; color: #1e1b4b; }
  .btn { background: #4f46e5; color: white; border: none; padding: .6rem 1.2rem; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 1rem; }
</style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <button class="active" onclick="load('Explore', this)">✨ Explore Clubs</button>
      <button onclick="load('Check-in', this)">📍 Live Check-in</button>
      <button onclick="load('Certs', this)">🎓 Certificates</button>
    </div>
    <div class="glass" id="content">
      <h2>Welcome Back, Student</h2>
      <p style="color: #475569;">Your hub for campus activities, QR check-ins, and institutional tracking.</p>
      <button class="btn" onclick="alert('Action triggered!')">Get Started</button>
    </div>
  </div>
<script>
  function load(t, el) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('content').innerHTML = `<h2>${t}</h2><p style="color: #475569;">Interactive glass container loaded for ${t}.</p>`;
  }
</script>
</body>
</html>
