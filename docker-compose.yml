services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema changes are applied by the `migrate` service below (tracked in
      # schema_migrations), for new and existing volumes alike.
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # One-shot: applies pending SQL migrations, then exits. Safe to re-run.
  migrate:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./backend:/app
    command: python -m app.migrate

  api:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    # --reload is for dev. For load tests use: --workers 4 and remove --reload.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on:
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    command: celery -A workers.celery_app worker -l info

  beat:
    build: ./backend
    env_file: .env
    environment:
      APP_MODE: production
    depends_on:
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes: ["./backend:/app"]
    # schedule file goes to /tmp so it doesn't litter your project folder
    command: celery -A workers.celery_app beat -l info -s /tmp/celerybeat-schedule

volumes:
  pgdata:
  uploads:
